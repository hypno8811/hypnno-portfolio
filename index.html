<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hypnno</title>
  <meta name="description" content="Hypnno — music, visuals and selected works." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="transition-shader" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="#works" aria-label="Hypnno home">
      <img src="assets/source/logo-transparent.png" alt="Hypnno" />
    </a>

    <nav class="nav" aria-label="Primary navigation">
      <a href="#works">Music</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="works" class="works" aria-label="My projects">
      <p class="tiny-note tiny-note--top">MY PROJECTS / CLICK A COVER</p>
      <p class="tiny-note tiny-note--side">HYPNNO<br>2026</p>

      <button class="work work--1" data-title="HYPNOTIC" data-type="RELEASE" data-description="In 2022, I released this EP as a collection of songs I did in 2021-22. I consider this one of my best works" data-link="https://open.spotify.com/album/3dew1coZVDqSkaf6AJlOSb?si=fkz5SiaUQs6NRILyzyuMHw" data-link-label="LISTEN" aria-label="Open Hypnotic">
        <img src="assets/source/hypnotic-cover-original.jpg" alt="Hypnotic artwork" />
        <span class="work-meta"><b>HYPNOTIC</b><i>01</i></span>
      </button>

      <button class="work work--2" data-title="HELIUM" data-type="SINGLE" data-description="Released in 2026 and made in 2024, this is one of my best tracks and it would be a crime to not release it." data-link="https://ditto.fm/helium-hypnno" data-link-label="LISTEN" aria-label="Open Helium">
        <img src="assets/source/helium-cover-original.jpg" alt="Helium artwork" />
        <span class="work-meta"><b>HELIUM</b><i>04</i></span>
      </button>

      <button class="work work--3" data-title="Xvii" data-type="VISUAL / RELEASE ART" data-description="My first studio album ever. Inspired by the likes of Skrillex, deadmau5 and Eric Prydz, this album is my love letter to progressive house." data-link="https://open.spotify.com/album/6QhTHPbt53X5dPUyUmQ0en?si=_6l2iTh9Rn-3wx-0yHjncw" data-link-label="SPOTIFY" aria-label="Open Xvii">
        <img src="assets/source/xvii-poster-original.png" alt="Xvii artwork" />
        <span class="work-meta"><b>Xvii</b><i>02</i></span>
      </button>

      <button class="work work--4" data-title="Unhappy / Feel / Family" data-type="VISUAL" data-description="Released in the beginning of 2024, it is made with drums that I recorded with a mic, lush pads, strong synths and the cherry on top: emotion" data-link="https://ditto.fm/unhappy-feel-family" data-link-label="VIEW" aria-label="Open Unhappy / Feel / Family">
        <img src="assets/generated/halo-portrait.png" alt="Monochrome halo visual" />
        <span class="work-meta"><b>UNHAPPY / FEEL / FAMILY</b><i>03</i></span>
      

    </section>

    <section id="about" class="plain-section plain-section--about">
      <p class="section-label">ABOUT</p>
      <div class="plain-copy">
        <p>Hypnno is a Brazilian based multi instrumentalist, dj, producer and artist that blends pop and electronic music in his own style. </p>
      </div>
    </section>

    <section id="contact" class="plain-section plain-section--contact">
      <p class="section-label">CONTACT</p>
      <a class="big-mail" href="mailto:tekeidorecords@gmail.com">tekeidorecords@gmail.com</a>
      <div class="social-row">
        <a href="https://ditto.fm/unhappy-feel-family" target="_blank" rel="noreferrer">Instagram</a>
        <a href="https://ditto.fm/unhappy-feel-family" target="_blank" rel="noreferrer">YouTube</a>
        <a href="https://open.spotify.com/album/3dew1coZVDqSkaf6AJlOSb?si=fkz5SiaUQs6NRILyzyuMHw" target="_blank" rel="noreferrer">SoundCloud</a>
        <a href="https://open.spotify.com/album/6QhTHPbt53X5dPUyUmQ0en?si=_6l2iTh9Rn-3wx-0yHjncw" target="_blank" rel="noreferrer">Spotify</a>
      </div>
    </section>
  </main>

  <div class="focus" id="focus" aria-hidden="true">
    <button class="focus-close" id="focus-close" aria-label="Close">CLOSE</button>
    <div class="focus-dim"></div>

    <div class="focus-copy focus-copy--left">
      <p class="focus-type" id="focus-type">RELEASE</p>
      <div class="smear-wrap"><h2 class="focus-title" id="focus-title">TITLE</h2></div>
    </div>

    <div class="focus-media-wrap">
      <button class="focus-play" id="focus-play" type="button">PLAY PREVIEW</button>
    </div>

    <div class="focus-copy focus-copy--right">
      <p class="focus-description" id="focus-description"></p>
      <a class="focus-link" id="focus-link" href="#" target="_blank" rel="noreferrer">LISTEN ↗</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
