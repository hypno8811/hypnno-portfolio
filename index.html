<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hypnno</title>
  <meta name="description" content="Hypnno — music, visuals and selected works." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="transition-shader" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="#works" aria-label="Hypnno home">
      <img src="assets/source/logo-transparent.png" alt="Hypnno" />
    </a>

    <nav class="nav" aria-label="Primary navigation">
      <a href="#works">Music</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="works" class="works" aria-label="Selected works">
      <p class="tiny-note tiny-note--top">SELECTED WORKS / CLICK A COVER</p>
      <p class="tiny-note tiny-note--side">HYPNNO<br>2026</p>

      <button class="work work--1" data-title="HYPNOTIC" data-type="RELEASE" data-description="Selected Hypnno release. Open the listening destination for the full track." data-link="https://soundcloud.com/hypnno" data-link-label="LISTEN" aria-label="Open Hypnotic">
        <img src="assets/source/hypnotic-cover-original.jpg" alt="Hypnotic artwork" />
        <span class="work-meta"><b>HYPNOTIC</b><i>01</i></span>
      </button>

      <button class="work work--2" data-title="HELIUM" data-type="SINGLE" data-description="Helium by Hypnno. Open the official listening link." data-link="https://ditto.fm/helium-hypnno" data-link-label="LISTEN" aria-label="Open Helium">
        <img src="assets/source/helium-cover-original.jpg" alt="Helium artwork" />
        <span class="work-meta"><b>HELIUM</b><i>02</i></span>
      </button>

      <button class="work work--3" data-title="XVI" data-type="VISUAL / RELEASE ART" data-description="A stark black-and-white Hypnno artwork from the current visual language." data-link="https://open.spotify.com/artist/1BzGaWD5h7amKZVajkGOyG" data-link-label="SPOTIFY" aria-label="Open XVI">
        <img src="assets/source/xvi-poster-original.png" alt="XVI artwork" />
        <span class="work-meta"><b>XVI</b><i>03</i></span>
      </button>

      <button class="work work--4" data-title="STATE / 01" data-type="VISUAL" data-description="A monochrome atmosphere study from the Hypnno visual world." data-link="https://www.instagram.com/iamhypnno" data-link-label="VIEW" aria-label="Open State 01">
        <img src="assets/generated/halo-portrait.png" alt="Monochrome halo visual" />
        <span class="work-meta"><b>STATE / 01</b><i>04</i></span>
      </button>

      <button class="work work--5" data-title="STATE / 02" data-type="VISUAL" data-description="A quiet nocturnal visual study built around repetition, scale and altered states." data-link="https://www.instagram.com/iamhypnno" data-link-label="VIEW" aria-label="Open State 02">
        <img src="assets/generated/bedroom-cosmic.png" alt="Nocturnal cosmic visual" />
        <span class="work-meta"><b>STATE / 02</b><i>05</i></span>
      </button>

      <div class="scroll-mark" aria-hidden="true"><span></span><em>SCROLL</em></div>
    </section>

    <section id="about" class="plain-section plain-section--about">
      <p class="section-label">ABOUT</p>
      <div class="plain-copy">
        <p>Hypnno is a Brazilian producer and artist working between music, atmosphere and monochrome visual experiments.</p>
      </div>
    </section>

    <section id="contact" class="plain-section plain-section--contact">
      <p class="section-label">CONTACT</p>
      <a class="big-mail" href="mailto:tekeidorecords@gmail.com">tekeidorecords@gmail.com</a>
      <div class="social-row">
        <a href="https://www.instagram.com/iamhypnno" target="_blank" rel="noreferrer">Instagram</a>
        <a href="https://www.youtube.com/@iamhypnno" target="_blank" rel="noreferrer">YouTube</a>
        <a href="https://soundcloud.com/hypnno" target="_blank" rel="noreferrer">SoundCloud</a>
        <a href="https://open.spotify.com/artist/1BzGaWD5h7amKZVajkGOyG" target="_blank" rel="noreferrer">Spotify</a>
      </div>
    </section>
  </main>

  <div class="focus" id="focus" aria-hidden="true">
    <button class="focus-close" id="focus-close" aria-label="Close">CLOSE</button>
    <div class="focus-dim"></div>

    <div class="focus-copy focus-copy--left">
      <p class="focus-type" id="focus-type">RELEASE</p>
      <div class="smear-wrap"><h2 class="focus-title" id="focus-title">TITLE</h2></div>
    </div>

    <div class="focus-media-wrap">
      <button class="focus-play" id="focus-play" type="button">PLAY PREVIEW</button>
    </div>

    <div class="focus-copy focus-copy--right">
      <p class="focus-description" id="focus-description"></p>
      <a class="focus-link" id="focus-link" href="#" target="_blank" rel="noreferrer">LISTEN ↗</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
